name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Пока в Settings → Pages источник «Deploy from a branch», GitHub
      # параллельно собирает из ветки README и выкладывает его на пару секунд
      # позже нас. Ждём, пока та сборка закончится, и выкладываем свою
      # последней. Когда источник переключат на «GitHub Actions», той сборки
      # не будет, и шаг выйдет сам через полминуты
      - name: Wait for branch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            status=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}"               --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "none"')
            echo "branch build: $status"
            if [ "$status" = "completed" ]; then sleep 5; break; fi
            if [ "$status" = "none" ] && [ "$i" -ge 3 ]; then break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
