name: deploy

on:
  push:
    branches: [main]
  # Пока в Settings → Pages источник «Deploy from a branch», GitHub параллельно
  # собирает сайт из ветки (README вместо сайта) и заканчивает позже нас.
  # Этот запуск идёт после той сборки, поэтому последним всегда выкладывается
  # наш сайт. Когда источник переключат на «GitHub Actions», та сборка
  # пропадёт и этот триггер просто перестанет срабатывать
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
